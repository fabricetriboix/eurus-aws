name: OpenTofu CD - env/cnp

on:
  push:
    branches:
    - main
    paths:
    - env/cnp/**
    - .github/workflows/env-cnp-cd.yaml
    - .github/actions/tg-cd/**
    - Makefile

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

concurrency:
  group: env-cnp
  cancel-in-progress: false

jobs:
  cd:
    runs-on: ubuntu-latest
    environment: cnp

    steps:
    - name: Checkout the code
      uses: actions/checkout@v5

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}:role/github-actions-role-${{ vars.ORG }}-${{ vars.PROJECT }}
        role-session-name: github-actions
        aws-region: ${{ vars.STS_REGION || vars.AWS_REGION1 }}

    - name: Run CD
      uses: ./.github/actions/tg-cd
      with:
        component-type: env
        component-name: cnp
        role-arn: "arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/tf-role-${{ vars.ORG }}-${{ vars.PROJECT }}"
        aws-region1: ${{ vars.AWS_REGION1 }}
        aws-region2: ${{ vars.AWS_REGION2 }}
        sts-region: ${{ vars.STS_REGION || vars.AWS_REGION1 }}
        org: ${{ vars.ORG }}
        project: ${{ vars.PROJECT }}
        common-nonprod-account-ids: ${{ vars.COMMON_NONPROD_ACCOUNT_IDS }}
        common-prod-account-ids: ${{ vars.COMMON_PROD_ACCOUNT_IDS }}
        app-nonprod-account-ids: ${{ vars.APP_NONPROD_ACCOUNT_IDS }}
        app-prod-account-ids: ${{ vars.APP_PROD_ACCOUNT_IDS }}
        action: apply
