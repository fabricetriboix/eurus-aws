# Delete a container image from either the nonprod or prod ECR registry
name: ++ Delete container image

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to delete; eg: `mirror/nginx:1.30.5`"
        required: true
        type: string
      environment:
        description: "Environment to delete the image from"
        required: true
        type: string
        choices:
        - common-nonprod
        - common-prod

permissions:
  id-token: write  # This is required for requesting the JWT
  contents: read   # This is required for actions/checkout

concurrency:
  group: env-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}:role/github-actions-role
        role-session-name: github-actions
        aws-region: ${{ vars.AWS_REGION }}

    - name: Check if AWS credentials have been set
      if: failure()
      shell: bash
      run: |
        echo "FAILURE_REASON=Failed to configure AWS credentials" >> "$GITHUB_ENV"
        exit 1

    - name: Assume role in child account
      shell: bash
      env:
        AWS_REGION: ${{ vars.AWS_REGION }}
      run: |
        trap 'echo "FAILURE_REASON=Failed to assume role in child account" >> "$GITHUB_ENV" && exit 1' ERR
        creds=$(aws sts assume-role --role-arn "arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/tf-role-${{ vars.AWS_REGION }}" --role-session-name delete-image)
        echo "AWS_ACCESS_KEY_ID=$(echo "$creds" | jq -r '.Credentials.AccessKeyId')" >> "$GITHUB_ENV"
        echo "AWS_SECRET_ACCESS_KEY=$(echo "$creds" | jq -r '.Credentials.SecretAccessKey')" >> "$GITHUB_ENV"
        echo "AWS_SESSION_TOKEN=$(echo "$creds" | jq -r '.Credentials.SessionToken')" >> "$GITHUB_ENV"
        echo "AWS_CREDS_OK=yes" >> "$GITHUB_ENV"

    - name: Delete image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        AWS_REGION: ${{ vars.AWS_REGION }}
        ENV: ${{ inputs.environment }}
      run: |
        if [ "${AWS_CREDS_OK:-no}" != "yes" ]; then
          echo "AWS credentials not set, can't delete the image"
          echo "Failure reason: ${FAILURE_REASON:-unknown}"
          exit 1
        fi
        name="${IMAGE%%:*}"
        tag="${IMAGE##*:}"
        if ! response=$(aws ecr batch-delete-image --repository-name "$name" --image-ids imageTag="$tag"); then
          echo "Failed to delete image from $ENV ECR"
          echo "FAILURE_REASON=Failed to delete image from $ENV ECR" >> "$GITHUB_ENV"
          exit 1
        fi
        if [ "$(echo "$response" | jq -r '.failures | length')" -ne 0 ]; then
          reason=$(echo "$response" | jq -r '.failures[0].failureCode')
          echo "Failed to delete image from $ENV ECR: $reason"
          echo "FAILURE_REASON=Failed to delete image from $ENV ECR: $reason" >> "$GITHUB_ENV"
          exit 1
        fi
        digest=$(echo "$response" | jq -r '.imageIds[0].imageDigest')
        echo "DIGEST=$digest"
        echo "DIGEST=$digest" >> "$GITHUB_ENV"

    - name: Audit trail
      if: success() || failure()
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        AWS_REGION: ${{ vars.AWS_REGION }}
        ORG: ${{ vars.ORG }}
        PROJECT: ${{ vars.PROJECT }}
        ENV: ${{ inputs.environment }}
      run: |
        if [ "${AWS_CREDS_OK:-no}" != "yes" ]; then
          echo "AWS credentials not set, can't upload audit trail to S3"
          echo "Failure reason: ${FAILURE_REASON:-unknown}"
          exit 1
        fi
        actor="$GITHUB_ACTOR"
        actor_id="$GITHUB_ACTOR_ID"
        utc_now=$(date -u +%Y%m%dT%H%M%S)
        image="$IMAGE"
        digest="$DIGEST"
        account_id="$ACCOUNT_ID"
        region="$AWS_REGION"
        if [[ -z "${FAILURE_REASON:-}" ]]; then
          success=true
          reason="Image successfully deleted"
        else
          success=false
          reason="$FAILURE_REASON"
        fi
        filename="audit-delete-${utc_now}.json"
        run_id="$GITHUB_RUN_ID"
        run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/$run_id"
        jq -n \
          --arg actor "$actor" \
          --arg actor_id "$actor_id" \
          --arg utc_now "$utc_now" \
          --arg image "$image" \
          --arg digest "$digest" \
          --arg account_id "$account_id" \
          --arg region "$region" \
          --arg github_run_id "$run_id" \
          --arg github_run_url "$run_url" \
          --argjson success "$success" \
          --arg reason "$reason" \
          '{
            actor: $actor,
            actor_id: $actor_id,
            utc_now: $utc_now,
            image: $image,
            digest: $digest,
            account_id: $account_id,
            region: $region,
            github_run_id: $github_run_id,
            github_run_url: $github_run_url,
            success: $success,
            reason: $reason
          }' > "$filename"
        bucket="${ORG}-${PROJECT}-${ENV}-${region}-ecr"
        date_dir="${utc_now%%T*}"
        aws s3 cp "$filename" "s3://$bucket/audit/delete/$date_dir/$filename"
